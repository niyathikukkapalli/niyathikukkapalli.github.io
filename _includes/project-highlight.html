<div class="project-highlight project-highlight--{{ include.variant | default: 'presented' }}">
  <span class="project-highlight-icon" aria-hidden="true">
    {% if include.variant == 'accepted' %}
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
    {% else %}
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 21h8"></path>
      <path d="M12 17v4"></path>
      <path d="M7 4h10v3a5 5 0 0 1-10 0V4z"></path>
      <path d="M5 4H3v2a3 3 0 0 0 3 3"></path>
      <path d="M19 4h2v2a3 3 0 0 1-3 3"></path>
    </svg>
    {% endif %}
  </span>
  <p class="project-highlight-text">
    <span class="project-highlight-label">{{ include.label }}</span>{{ include.text }}
  </p>
</div>
